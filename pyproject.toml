[project]
name = "central_command"
version = "0.1.0"
description = "A human-supervised agentic team framework — a control plane over Claude agents."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Imported directly in config.py (mirror .env into os.environ for the
    # open-ended per-agent CC_LLM_PROXY_KEY_* / CC_MODEL_* lookups).
    "python-dotenv>=1.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "httpx>=0.27",
    # Cron-expression schedules for the heartbeat (D27).
    "croniter>=2.0",
    # Bolt for the cockpit Graph panel (integrations/neo4j_reader.py, every
    # session READ_ACCESS), the operator's curation writer
    # (integrations/neo4j_writer.py) and graphiti-core's own driver. Agents'
    # graph reads run over it in-process too; what `runtime/` may never hold
    # is a WRITE path (tests/test_governance.py enforces the import graph).
    "neo4j>=5",
    # The knowledge graph's extraction and search, in-process (design record
    # 2026-10-04, D1) — it replaced the Graphiti MCP server, whose in-memory
    # queue acknowledged episodes and then dropped them. EXACT pin: the two
    # upstream fixes we carry (deploy/graphiti-patches/, applied by
    # scripts/apply_graphiti_patches.py after every install) are written
    # against this version and refuse any other. Raising it is a deliberate
    # act: bump here AND `graphiti_patches.PINNED_VERSION` (a test pins them
    # equal), re-cut both patches, run the full suite.
    "graphiti-core==0.30.2",
    # The Executor parses proposed LiteLLM config files before writing them
    # (litellm.apply_config_change); deploy/pi/litellm/policy.py reads the
    # routing declaration with it too.
    "pyyaml>=6",
    # HTML mail -> the text an agent reads (ingest/mailtext.py). Layout-table
    # aware and drops nothing; chosen by bake-off over markdown converters
    # (5-8x the tokens) and article extractors (which delete receipts).
    "inscriptis>=2.7,<3",
    # Decrypting LiteLLM's stored credentials for autodiscovery
    # (integrations/litellm_credstore.py): pynacl for its default SecretBox
    # scheme (still the default in 1.94.1), cryptography for the opt-in
    # AES-GCM "v2:gcm:" scheme.
    # On-premises Microsoft Exchange over EWS (integrations/exchange.py). CORE,
    # not an extra: the mail FEED and the Executor both reach it on a site
    # whose only mailbox is Exchange, so an install missing it has no mail at
    # all. It brings NTLM (requests-ntlm/pyspnego), the SOAP layer (lxml,
    # defusedxml, isodate) and the Windows→IANA time-zone map this codebase
    # otherwise lacks — 1,000 lines of hand-rolled SOAP is the wrong trade for
    # one dependency. Capped below 6 because the majors move the Account API.
    "exchangelib>=5.6,<6",
    "pynacl>=1.5",
    "cryptography>=42",
]

[project.optional-dependencies]
# The agent runtime deps (needed from milestone M2 onward). Kept separate so the
# M0/M1 spine can be built and tested without the heavier runtime stack.
# NOTE: confirm exact versions against current docs at M2 (see Phase-1 plan §7).
# `dbos` and `mcp` were declared here for a future that arrived differently:
# durability is Postgres + `runtime/durable.py`, and the graph is reached
# through graphiti-core in-process (core dependencies above) — no MCP client
# at all. Nothing imports either package (grep, 2026-08-01) — removed rather
# than left as a claim.
runtime = [
    # Pinned to the TESTED minor. Unpinned, a fresh install resolved 2.33.0 and
    # failed test_skills_delivery (rehearsal finding F9, 2026-08-21) — every
    # gift install was getting an untested runtime. Raising this bound is a
    # deliberate act: bump, run the full suite, then commit both together.
    "pydantic-ai>=2.18,<2.19",
    # HTML->markdown for the web-fetch tool (integrations/webfetch.py).
    # trafilatura does the primary boilerplate-stripping extraction; markdownify
    # (pulling in beautifulsoup4) stays as the fallback for pages trafilatura
    # can't extract from (e.g. very short/empty bodies).
    "trafilatura>=1.12",
    "markdownify>=0.13",
    # File->markdown conversion for the skills-library file-upload import
    # (POST /api/skills/import-file). pdf/docx/pptx/xlsx extras cover the
    # document types operators actually hand over; the audio-transcription
    # and Azure content-understanding extras are skipped on purpose (heavy,
    # unused).
    "markitdown[pdf,docx,pptx,xlsx]>=0.1.7",
    # Page rendering for the scanned-PDF OCR fallback (api/attachments.py):
    # markitdown finds no text -> pypdfium2 renders pages -> the session's
    # vision model transcribes them. Was already in the venv transitively;
    # declared here because attachments.py imports it directly.
    "pypdfium2>=4",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.6",
    # Declared since v2.45.5: every release gate this week ran with
    # `--timeout=120` against a venv that carried the plugin UNDECLARED, while a
    # fresh install (the Windows testbed, F35) answered "unrecognized arguments:
    # --timeout". A test that hangs on a live service must fail, not stall.
    "pytest-timeout>=2.3",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["central_command"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# SEQUENTIAL by default, on purpose: `pytest -q` (~4 min on a Pi since the
# connection pool, v2.31.0) is the gate because it is the run that exposes a
# test leaking state into its neighbour. `-n 4` (~2 min) passes cleanly —
# conftest.py gives every xdist worker its own database — and is the quick
# pass, opted into per run rather than made the default.
#
# The per-test ceiling is CONFIGURATION, not a flag somebody has to remember
# (ledger F40): the suite's live graph reads embed through LiteLLM to an external
# backend, and with that backend off they do not fail — they hang. The Windows
# testbed's "11-hour suite" was almost certainly this. 120 s is far above the
# slowest honest test and far below "nobody is watching any more".
#
# What a timeout DOES depends on the platform. With SIGALRM (Linux, macOS)
# pytest-timeout's `signal` method fails THAT test and the session goes on.
# Windows has no SIGALRM, so only the `thread` method exists there: it dumps
# every stack and `os._exit`s the WHOLE pytest process — no summary, no list of
# results (2026-10-02 testbed, F13: one 120 s overrun at ~79 % ended the
# session). Neither `timeout_method` nor `timeout_func_only` changes that —
# func_only only moves the clock off fixture setup/teardown. So a timeout on
# Windows must never be reached by an honest test: every test that drives
# the REAL ./setup.sh / ./update.sh (up to ~300 s each on Windows) carry
# `@drives_installer` — tests/installer_source.py, ONE number for all of them —
# and run the script through `run_driver`, which enforces its own per-run
# limit, kills the invocation's process tree and fails that test itself, on
# every platform, before this backstop could fire. Everything else keeps 120 s.
timeout = 120
markers = [
    "graph_live: performs a LIVE knowledge-graph read (embedder/LLM must answer). conftest's session preflight skips these when the backend does not answer within 10 s.",
]

[tool.ruff]
line-length = 100
target-version = "py312"
