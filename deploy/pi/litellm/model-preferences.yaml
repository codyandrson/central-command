# ============================================================================
# DECLARED LiteLLM routing policy — the truth this repo commits to.
#
#   Applied by:   python3 deploy/pi/litellm/policy.py --apply
#   Checked by:   python3 deploy/pi/litellm/policy.py --check  (and verify.sh)
#   Guarded by:   tests/test_litellm_policy.py
#
#   The models themselves live in the LiteLLM Postgres (store_model_in_db:
#   true), so they cannot be declared in config.yaml without creating duplicate
#   deployments. But "model X is tier 2 and good at code" is a decision worth
#   reviewing in a diff, so it is declared HERE and pushed into the DB.
#
#   !! THE TWO HALVES LIVE IN DIFFERENT PLACES INSIDE LITELLM !!
#     adaptive_router_preferences  ->  model_info       (router.py:7659)
#     input_cost_per_token         ->  litellm_params   (router.py:7666)
#   Put either in the wrong home and the router does not error — it silently
#   scores every model identically. That is exactly the state found on
#   2026-07-26: model_costs {} and every cell at alpha=5/beta=5, so `cc-smart`
#   was a coin flip that happened to pick Sonnet for the prompt "say ok".
#
#   quality_tier: 1=budget 2=mid 3=frontier. BASE_TIER_WEIGHT = {1:0.3, 2:0.5,
#   3:0.7}; a request type listed in `strengths` adds +0.3, capped at 0.95.
#   These are the COLD-START PRIOR only — with COLD_START_MASS=10, roughly ten
#   real observations start to move them.
#
#   strengths values come from the fixed v0 taxonomy in
#   litellm/types/router.py::RequestType. Seven, no more.
#
#   ── `registration:` (added 2026-08-23; SKELETONS since 2026-08-30) ───────
#   Each entry carries the litellm_params register-models.py CREATES it with
#   when it is ABSENT from the proxy — and nothing else, ever: the catalog is
#   managed through LiteLLM's UI/API (operator decision, 2026-08-30), so an
#   alias that exists is never written to by this file. `PLACEHOLDER` marks
#   what the operator fills in during setup's pause on a fresh catalog (model
#   id, api_base host; the key/credential is never declared here at all).
#   Everything else in the block is an INVARIANT the re-run checks: the
#   bridge prefix on graphiti-llm, the reranker's mode and /v1/rerank path,
#   the per-alias timeouts. A fully-clean deployment used to have nothing to
#   register FROM (2026-08-23: eleven hand-composed registrations); now it
#   has the names and the rules, and the operator supplies the providers.
#
#   TIMEOUT HAS EXACTLY ONE HOME. For a model in `models:` it is the top-level
#   `timeout:` (which `policy.py --check` gates), and `registration:` must NOT
#   repeat it — two homes is how a DRIFT failure gets shipped. Only the
#   `registration_only:` entries below carry a timeout inside their block,
#   because policy.py does not declare them at all.
#
#   No entry carries `chat_template_kwargs`: reasoning control is injected
#   PER REQUEST from the `thinking_mechanism` / `thinking_levels` declarations
#   above (runtime/models._thinking_body), never baked into a deployment.
# ============================================================================

models:
  # ── Anthropic (billed; costs are $/token and must be non-zero) ────────────
  # thinking_mechanism `anthropic`: LiteLLM translates a top-level
  # `reasoning_effort` into Anthropic's native control (output_config.effort /
  # thinking), and accepts "xhigh" verbatim; "none" disables it. Undeclared
  # would mean Central Command sends NO thinking control at all.
  claude-opus-4-8:
    registration:
      model: anthropic/PLACEHOLDER   # no api_base: the provider's own
    quality_tier: 3
    strengths: [analytical_reasoning, technical_design]
    input_cost_per_token: 0.000005
    timeout: null
    thinking_mechanism: anthropic
    thinking_levels: ["off", "low", "medium", "xhigh"]   # "off" QUOTED: bare off is YAML false

  claude-sonnet-5:
    registration:
      model: anthropic/PLACEHOLDER
    quality_tier: 3
    strengths: [code_generation, writing]
    input_cost_per_token: 0.000002
    timeout: null
    thinking_mechanism: anthropic
    thinking_levels: ["off", "low", "medium", "xhigh"]   # "off" QUOTED: bare off is YAML false

  claude-haiku-4-5:
    registration:
      model: anthropic/PLACEHOLDER
    quality_tier: 2
    strengths: [factual_lookup, general]
    input_cost_per_token: 0.000001
    timeout: null
    thinking_mechanism: anthropic
    thinking_levels: ["off", "low", "medium", "xhigh"]   # "off" QUOTED: bare off is YAML false

  # ── Workstation, 100.73.68.9 over Tailscale (free; often off) ─────────────
  # timeout is generous ON PURPOSE: liveness is now detected by background
  # health checks (config.yaml general_settings), which frees the request
  # timeout to cover a COLD MODEL LOAD. A short timeout here would misread a
  # legitimate model swap as an outage. The 900s previously set on
  # qwen3-coder-next was the opposite mistake — long enough to hang a caller
  # for a quarter of an hour with no fallback configured.
  #
  # REPLACED 2026-08-15: qwen3-coder-next (Qwen3-Coder-Next 80B-A3B) -> Qwen3.6-27B
  # dense. The 80B was chosen on CODING benchmarks in July and Graphiti's entity
  # extraction inherited it as a side effect, which is not what this endpoint is
  # mostly for: one server answers BOTH `cc-default` (every agent) and
  # `graphiti-llm` (knowledge-graph extraction, dedup and contradiction
  # detection). `strengths` says so now — the old value advertised a code model
  # to a router making judgment calls about people and relationships.
  #
  # UPGRADED 2026-08-18: Qwen3.6-27B -> Qwen3.8-27B. Same architecture exactly
  # (64 layers, 5120 hidden, Gated DeltaNet hybrid, 262K native, Apache 2.0,
  # same vision encoder) — the gain is post-training, so the KV-cache maths,
  # the 49152 context and the VRAM budget all carry over unchanged (21,259 MiB
  # loaded vs 21,263 before). What is genuinely new is the MTP head: Qwen
  # trained nextn layers into 3.8 and unsloth's GGUF keeps them, so
  # `--spec-type draft-mtp` is speculative decoding with no draft model.
  # 3.6 has no such tensors — that flag is 3.8-only.
  # VISION since 2026-08-19: the server loads unsloth's mmproj for 3.8
  # (`--no-mmproj-offload` — projector in system RAM). `supports_vision` is
  # what the attachment gate reads (`litellm.model_accepts_images`):
  # capability is DECLARED, not guessed, and None means "nobody said", never
  # "yes". `max_input_tokens` is the SERVING context, not the 262K native
  # window — the app's context-pressure check prefers this over its 200K
  # fallback (config.py). 81920 since later on 2026-08-19: the embedder moved
  # to CPU (100ms/query measured — trivial at ~165 calls/day), freeing the
  # VRAM that had capped context at 49152, and the :8081 slot is now
  # llama-swap (`cc-swap` container, ~/QWEN/llama-swap.yaml on the
  # workstation): one big model at a time, requests QUEUE through a swap.
  qwen3.8-27b:
    registration:
      model: openai/PLACEHOLDER
      api_base: PLACEHOLDER   # the llama-swap slot (cc-swap)
    quality_tier: 2
    strengths: [factual_lookup, general, code_understanding]
    input_cost_per_token: 0
    # 6000, was 600, was 300 (2026-08-20, operator decision): under llama-swap
    # FIFO a request waits behind the whole queue, and the operator would "much rather
    # long running processes than crashing processes just because they were
    # waiting". Outage detection is unharmed: a dead workstation refuses the
    # TCP connection instantly — the timeout only governs connected-but-queued.
    timeout: 6000
    supports_vision: true
    max_input_tokens: 81920
    # MEASURED 2026-08-30 by litellm_probe_model (deploy: forced tool_choice
    # 1 call, auto 2 parallel calls, json_schema and json_object both
    # parsed, reasoning_content present). Declared because LiteLLM's own
    # aggregate view (/model_group/info) reads an UNDECLARED flag as false —
    # cc-default advertised `supports_function_calling: false` while every
    # agent called tools through it. Re-probe before changing.
    mode: chat
    supports_function_calling: true
    supports_response_schema: true
    # Qwen3.8's chat template takes enable_thinking / reasoning_effort through
    # chat_template_kwargs. There is NO reasoning_effort "none" — the template
    # raises and every request 500s — so `off` is enable_thinking: false.
    thinking_mechanism: qwen_template
    thinking_levels: ["off", "low", "medium", "xhigh"]   # "off" QUOTED: bare off is YAML false

  # PROMOTED from `aliases` 2026-08-19: cc-default is not just a fallback key —
  # it is a real DB deployment (openai/qwen3.8-27b) with its own litellm_params
  # and model_info, and it is the model id agents actually resolve, so the
  # capability declarations above must live on THIS entry too or the attachment
  # gate answers from the undeclared alias and refuses every image.
  cc-default:
    # A real DB deployment onto the SAME upstream model as qwen3.8-27b, not an
    # alias — that is why both entries exist and both must be registered.
    registration:
      model: openai/PLACEHOLDER
      api_base: PLACEHOLDER
    quality_tier: 2
    strengths: [factual_lookup, general, code_understanding]
    input_cost_per_token: 0
    timeout: 6000  # same reasoning as qwen3.8-27b above
    supports_vision: true
    max_input_tokens: 81920
    mode: chat                        # measured 2026-08-30, see qwen3.8-27b
    supports_function_calling: true
    supports_response_schema: true
    thinking_mechanism: qwen_template
    thinking_levels: ["off", "low", "medium", "xhigh"]   # "off" QUOTED: bare off is YAML false

  # THE JUDGE (2026-08-19): GPT-OSS-20B MXFP4 at 131072 ctx on the SAME
  # llama-swap slot — requesting it swaps the 27B out (~10s, queued) and ttl
  # 600 idles it back out. Role, decided before registering (per the STATUS
  # rule): a second opinion for graph-judgment work (extraction/contradiction
  # A/B). It is NOT in any routing pool and nothing falls back to it. No
  # supports_vision: it has no vision encoder.
  gpt-oss-20b:
    registration:
      model: openai/PLACEHOLDER
      api_base: PLACEHOLDER
    quality_tier: 2
    strengths: [analytical_reasoning, factual_lookup]
    input_cost_per_token: 0
    # 18000 (was 1800; ×10 by operator decision 2026-08-20): a judge request
    # FIFO-queues behind the entire current drain (8m20s observed) before its
    # swap even starts. Judge calls are deliberate and low-volume; waiting is
    # correct, timing out is not.
    timeout: 18000
    max_input_tokens: 131072
    # MEASURED 2026-08-30 (litellm_probe_model): tools yes (one call per
    # turn observed — parallel inconclusive, so not declared), json_schema
    # and json_object yes, reasoning_content yes, vision NO (no mmproj: the
    # 500 the attachment gate was built around) — left undeclared on purpose,
    # the gate treats absent as text-only.
    mode: chat
    supports_function_calling: true
    supports_response_schema: true

  # JUDGE CANDIDATE #2 (2026-08-19): Gemma 4 31B dense on the same llama-swap
  # slot. Chosen from dated primary sources (Google model card / arXiv
  # 2607.02770, Jul 2026): GPQA Diamond 84.3 vs GPT-OSS-20B-high's 71.5, HLE
  # 19.5 vs 10.9 — and a THIRD lineage (Google), so both judge candidates are
  # decorrelated from the Qwen generalist they second-guess. Dense 31B ≈
  # ~30 t/s on the 3090 — fine for deliberate judge calls, wrong for
  # cc-default. Tier 3 on those scores. The judge A/B (27B vs 20B vs this)
  # decides which model KEEPS the role; the loser(s) may be retired per the
  # decide-the-role-first rule.
  gemma-4-31b:
    registration:
      model: openai/PLACEHOLDER
      api_base: PLACEHOLDER
    quality_tier: 3
    strengths: [analytical_reasoning]
    input_cost_per_token: 0
    timeout: 18000  # same reasoning as gpt-oss-20b above
    # 65536 measured 2026-08-20: gemma KV ≈ 50 KB/token (pricier than the Qwen
    # hybrid), 654 MiB free at 64K beside the reranker — its practical ceiling.
    max_input_tokens: 65536
    # MEASURED 2026-08-30 (litellm_probe_model): forced tool_choice 1 call,
    # auto 2 parallel calls, json_schema + json_object parsed,
    # reasoning_content present, vision NO (no mmproj) — undeclared on purpose.
    mode: chat
    supports_function_calling: true
    supports_response_schema: true

# ============================================================================
# REGISTRATION-ONLY models — they must EXIST on the proxy, but the adaptive
# router never scores them, so they carry no quality_tier / strengths / cost.
#
# They are deliberately NOT in `models:` above: policy.py --check would then
# demand `model_info.adaptive_router_preferences` on an embedder and a rerank
# endpoint, and report permanent DRIFT against a perfectly healthy proxy.
# `models:` is "what the router chooses between"; this block is "what else has
# to be registered". Together they are the authoritative list of eleven.
#
# Timeouts live HERE for these four (policy.py declares none of them), unlike
# the `models:` entries where the top-level `timeout:` is the single home.
# ============================================================================
registration_only:
  # THE BRIDGE. `openai/chat_completions/` forces LiteLLM's Responses->chat
  # bridge: graphiti_core's OpenAIClient always drives extraction through
  # `client.responses.parse`, llama.cpp implements no /v1/responses, and a plain
  # `openai/` prefix makes LiteLLM pass the request through with the
  # `text.format` json_schema SILENTLY DROPPED — the model answers prose and
  # every extraction fails. The prefix is the whole fix. Do not "normalise" it.
  graphiti-llm:
    registration:
      model: openai/chat_completions/PLACEHOLDER
      api_base: PLACEHOLDER
      timeout: 300

  # Named for graphiti's cross-encoder config, pointed at the local Qwen. It is
  # in RERANKER_API_KEY's model scope alongside cc-default; the name is a
  # graphiti-side expectation, not a claim that any OpenAI model is in use.
  gpt-4.1-nano:
    registration:
      model: openai/PLACEHOLDER
      api_base: PLACEHOLDER
      timeout: 300

  # Its own llama.cpp server (:8083), CPU-resident since 2026-08-19. Exactly
  # 1024 dimensions — a mis-sized vector corrupts the Neo4j index instead of
  # erroring, so never repoint this without re-embedding the graph.
  qwen3-embedding-local:
    registration:
      model: openai/PLACEHOLDER
      api_base: PLACEHOLDER
      timeout: 60

  # !! THE api_base MUST END IN /v1/rerank !!  Discovered in-pod during the
  # 2026-08-23 clean install and recorded nowhere until now. The `cohere/`
  # prefix selects LiteLLM's cohere client, and that client appends nothing —
  # it POSTs the api_base verbatim. Give it `.../v1` and the request lands on
  # the chat route, which is not a rerank endpoint. Resident on the GPU (:8082)
  # beside whatever llama-swap currently holds.
  qwen3-rerank-local:
    registration:
      model: cohere/PLACEHOLDER
      api_base: PLACEHOLDER/v1/rerank
      # The cohere client refuses to send without SOME key ("Cohere API key is
      # required" -> /rerank 500). The local server ignores it; the previous
      # instance carried a hand-set placeholder that was never declared here
      # (found 2026-08-29, first clean install driven from this file).
      mode: rerank
      timeout: 60

# Written to the DB via POST /fallback, NOT via router_settings.fallbacks —
# with store_model_in_db: true the DB wins for that key and a config.yaml
# block reads back as []. Verified 2026-07-26.
#
# Aliases are model GROUPS that exist only in LiteLLM's DB (config.yaml: the
# alias lives in Postgres so it can be re-pointed with no restart). They carry
# no preferences here, but they MAY carry fallbacks. Declared so the policy
# tests can tell "fallback for an alias" from "fallback for a typo".
# (`cc-default` moved UP into `models` 2026-08-19 — it needs capability
# declarations, which aliases cannot carry. Its pointer still lives in the DB.)
aliases: []

# EMPTY BY OPERATOR DECISION, 2026-07-31 — local models only for now.
#
# This block previously declared `[claude-haiku-4-5]` for qwen3-coder-next,
# qwen3.6-35b and cc-default. Those fallbacks were removed from the proxy
# because a workstation outage was silently reaching for Anthropic, and the
# attempt died anyway on `max_tokens: 262144 > 64000` — 366 such errors in four
# days. Failing fast with the real `Connection error` is what makes an outage
# diagnosable, and the operator is at the machine when it happens.
#
# This is CURRENT CONFIGURATION, not a rule. Provider models are expected back
# later to make the system more robust; the `claude-*` entries stay registered
# and dormant for exactly that. To restore, re-add keys here and run
# `policy.py --apply`. If you do, note the historical bite mark: the ALIAS needs
# its own key, because when the alias's one deployment is in COOLDOWN the router
# 429s on `cc-default` before any call happens and the lookup finds nothing
# declared there (found 2026-07-29, the first real workstation outage).
fallbacks: {}
