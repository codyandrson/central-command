# ============================================================================
# Central Command — SELF-CONTAINED stack for the Raspberry Pi (2026-07-25).
#
#   Everything the Nerve-era Central Command needs, on ONE host, so the Pi keeps
#   working with the rest of the homelab powered off. The desktop's three
#   separate stacks (Central Command / LiteLLM / n8n-agentic-team) are collapsed
#   here to only the parts Central Command actually depends on:
#
#     postgres  5442  the spine (state, ledger, event log)
#     litellm   4000  LLM routing (+ its own postgres & redis)
#     neo4j     7687  knowledge-graph backend
#     graphiti  8000  MCP server the agents read and the Executor writes
#     n8n       5678  the EMAIL facade only — it holds the Gmail OAuth
#
#   Deliberately NOT here: mattermost, the n8n worker + redis queue, n8n-mcp
#   (dev tooling, not runtime), and the retired s0–s3 pipeline workflows.
#   Jira is a native client since D23 and needs no container at all.
#
#   Runtime is Docker CE, not rootless podman: the Pi is a k3s node, and
#   Docker 29 leaves the iptables FORWARD policy at ACCEPT (it uses its own
#   DOCKER-FORWARD chain), so the cluster is untouched. Docker's daemon also
#   removes the need for deploy/homelab-portcheck.sh — that script exists only
#   because rootless podman's port forwarders fail to bind at boot.
#
#   Secrets come from deploy/pi/.env (gitignored). See .env.example.
#     docker compose -f deploy/pi/docker-compose.yml up -d
# ============================================================================
name: cc

services:
  # ── The spine ──────────────────────────────────────────────────────────────
  # Same shape as the repo-root docker-compose.yml, including the container
  # name: deploy/pi/cc-uvicorn.service starts `cc-postgres` by name.
  # 5442, never 5432 — the port convention travels with the project.
  postgres:
    image: docker.io/library/postgres:16
    container_name: cc-postgres
    mem_limit: 2g   # blast-radius cap (2026-07-28) — see litellm
    restart: always
    environment:
      POSTGRES_USER: central_command
      POSTGRES_PASSWORD: central_command
      POSTGRES_DB: central_command
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - cc_pgdata:/var/lib/postgresql/data
      - ../../central_command/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U central_command"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [cc-net]

  # ── LiteLLM proxy ──────────────────────────────────────────────────────────
  # CC_LLM_BASE_URL points here, and inbox-triage canaries the `cc-smart`
  # adaptive router, so this is a hard dependency of live runs.
  # LITELLM_SALT_KEY must match the instance the DB was dumped from or every
  # stored virtual key fails to decrypt.
  litellm-db:
    image: docker.io/library/postgres:16
    container_name: cc-litellm-db
    mem_limit: 1g   # blast-radius cap (2026-07-28) — see litellm
    restart: always
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: ${LITELLM_POSTGRES_PASSWORD:?set LITELLM_POSTGRES_PASSWORD in deploy/pi/.env}
    volumes:
      - litellm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmproxy -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [cc-net]

  litellm-redis:
    image: docker.io/library/redis:7-alpine
    container_name: cc-litellm-redis
    mem_limit: 512m   # blast-radius cap (2026-07-28) — see litellm
    restart: always
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - litellm_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [cc-net]

  litellm:
    # Pinned to a digest 2026-08-25 — main-stable is a moving tag; bumping
    # this is now a deliberate act, not an automatic pull.
    image: ghcr.io/berriai/litellm-database:main-stable@sha256:5ead13edd4efd89f32dab349c1f19447d395affca53f3aeae00f5e6e01b8c08d
    container_name: cc-litellm
    restart: always
    # MEMORY CAP — the 2026-07-28 lockups. The bundled Prisma query engine
    # leaks GBs per minute on arm64: a single engine process was measured
    # going 1.47 -> 4.82 GB in 24 seconds, dying ("engine_process_death"),
    # respawning, and repeating. Uncapped, the container reached 10.96 GiB of
    # the Pi's 15.6 GiB and drove available memory to 280 MB, taking the whole
    # host down three times (unclean reboots on 07-27 and twice on 07-28) —
    # including the k3s control plane, which has nothing to do with LiteLLM.
    #
    # memswap == mem_limit means NO swap for this container, on purpose: the
    # Pi's swap is 7.8 GB of zram, which is COMPRESSED RAM. Letting a leaking
    # process swap there consumes the resource it is exhausting.
    #
    # The cap converts a whole-host lockup into one container being OOM-killed
    # and restarted by `restart: always`. It is a blast-radius guard, NOT a fix
    # — the leak itself is still open.
    mem_limit: 6g
    memswap_limit: 6g
    # 0.0.0.0 matches the desktop deployment: reachable from any tailnet device,
    # not just this host. The Pi has no public exposure.
    ports:
      - "0.0.0.0:4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in deploy/pi/.env}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set LITELLM_SALT_KEY — must match the dumped DB}
      DATABASE_URL: postgresql://llmproxy:${LITELLM_POSTGRES_PASSWORD}@litellm-db:5432/litellm
      REDIS_HOST: litellm-redis
      REDIS_PORT: "6379"
      STORE_MODEL_IN_DB: "True"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # !! ANTHROPIC_API_KEY IS DELIBERATELY NOT PASSED IN (2026-07-26) !!
      # The Anthropic models resolve their key from the NAMED CREDENTIAL
      # `anthropic-main` (LiteLLM Credentials; models reference it via
      # litellm_credential_name), so nothing here needs an ambient one. Note the
      # env var IS still required by cc-graphiti further down — it is scoped out
      # of THIS service only. It is absent here because LiteLLM treats it as a
      # LAST-RESORT FALLBACK in two places that must never silently bill the operator's
      # pay-per-token key:
      #   1. /anthropic/* passthrough injects it as x-api-key
      #      (pass_through_endpoints/passthrough_endpoint_router.py get_credentials),
      #      and injected custom headers BEAT the client's forwarded ones
      #      (passthrough/utils.py:78, {**request_headers, **headers}). Claude Code
      #      on the Max subscription sends its OAuth token in Authorization; with
      #      this var set, Anthropic honoured the x-api-key instead — VERIFIED by
      #      experiment: a deliberately INVALID OAuth token still returned HTTP 200.
      #      That is the subscription being silently bypassed.
      #   2. A DB/config model row with neither an api_key nor a credential
      #      inherits it, so a mis-registered model spends money instead of erroring.
      # With it absent, both cases fail loudly. Adding it back re-opens case 1
      # silently — if a model needs a key, point it at the `anthropic-main`
      # credential instead.
      #
      # THE SECOND WAY IN, equally silent: setting `use_in_pass_through: true` on
      # any Anthropic model pushes that model's resolved key (credential or inline)
      # straight into the same passthrough injector (router.py:7965-8005). A named
      # credential is NOT inherently safe — it is safe only while nothing feeds
      # that injector. All six model rows are use_in_pass_through=false; keep them
      # that way, or Claude Code silently reverts to pay-per-token billing.
      #
      # Precedence gotcha if you ever debug this: in the completion path an INLINE
      # api_key BEATS the credential (utils.py:618 fills only keys not already
      # set), which is the opposite of the files/vector-store path. So an inline
      # key added "just to be safe" silently disables the credential.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # host.containers.internal is a podman-ism; on Docker the equivalent is
      # host.docker.internal, mapped via extra_hosts below. Only matters if a
      # DB-registered model routes to a local Ollama — cc-smart does not.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      litellm-db:
        condition: service_healthy
      litellm-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:4000/health/liveliness\").status==200 else 1)'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [cc-net]

  # ── Knowledge graph ────────────────────────────────────────────────────────
  neo4j:
    image: docker.io/library/neo4j:5.26.2
    container_name: cc-neo4j
    mem_limit: 2g   # blast-radius cap (2026-07-28) — see litellm
    restart: always
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in deploy/pi/.env}
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [cc-net]

  # The service name MUST stay `graphiti`: the derived image patches FastMCP's
  # DNS-rebinding allowlist to exactly {graphiti, localhost, 127.0.0.1}, and an
  # unlisted Host header is answered with HTTP 421.
  graphiti:
    build: ./graphiti
    image: cc-graphiti:1.0.2-anthropic
    container_name: cc-graphiti
    mem_limit: 1g   # blast-radius cap (2026-07-28) — see litellm
    restart: always
    environment:
      - CONFIG_PATH=/app/mcp/config/config.yaml
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?set NEO4J_PASSWORD in deploy/pi/.env}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in deploy/pi/.env}
      # EMBEDDINGS (migrated 2026-07-26): self-hosted Qwen3-Embedding-0.6B on
      # the operator's workstation, reached through THIS Pi's LiteLLM so the endpoint,
      # spend and any future failover stay in one place. The key is a LiteLLM
      # virtual key scoped to the embedding group only — not the master key.
      # Endpoint + credential only. The MODEL and DIMENSIONS are literals in
      # graphiti/config.yaml on purpose — they must agree with each other and
      # with the graph's stored vectors, so they don't belong in loose env.
      - EMBEDDER_API_URL=${EMBEDDER_API_URL:-http://litellm:4000/v1}
      - EMBEDDER_API_KEY=${EMBEDDER_API_KEY:?set EMBEDDER_API_KEY in deploy/pi/.env}
      # The RERANKER now goes through LiteLLM too (2026-07-26). graphiti_core
      # builds its cross-encoder as `OpenAIRerankerClient()` with no config, so
      # AsyncOpenAI falls back to these two env vars — that is the only seam
      # available without patching the image. The model it asks for is the
      # hardcoded 'gpt-4.1-nano', mapped by model_group_alias in
      # litellm/config.yaml to cc-default (the workstation's llama.cpp).
      #
      # The target MUST expose logprobs/top_logprobs: the reranker scores
      # passages from token log-probabilities. Anthropic models cannot serve
      # this at all, so cc-smart/claude-* are NOT valid targets here.
      - OPENAI_BASE_URL=${RERANKER_API_URL:-http://litellm:4000/v1}
      # OPENAI_API_KEY IS STILL REQUIRED — and NOT for embeddings.
      #
      # The long-standing comment here said "EMBEDDINGS ONLY", and spec Unit 3
      # said to drop this once the embedder moved. Both were wrong: dropping it
      # crash-looped cc-graphiti on startup (2026-07-26), because
      # graphiti_core.Graphiti.__init__ unconditionally constructs an
      # `OpenAIRerankerClient` cross-encoder, which raises if no key is present:
      #
      #   graphiti.py:224  self.cross_encoder = OpenAIRerankerClient()
      #   openai/_client.py:514  OpenAIError: The api_key client option must be set
      #
      # It is the RERANKER's credential, not the embedder's. It now holds a
      # LiteLLM virtual key (alias graphiti-reranker) rather than an OpenAI key,
      # because OPENAI_BASE_URL above points the client at LiteLLM. The var name
      # is dictated by the openai SDK's env fallback and cannot be renamed
      # without patching graphiti_core.
      - OPENAI_API_KEY=${RERANKER_API_KEY:?set RERANKER_API_KEY in deploy/pi/.env — LiteLLM key for the cross-encoder}
      - GRAPHITI_TELEMETRY_ENABLED=false
      # The Pi has 4 cores and shares them with k3s; keep extraction modest.
      - SEMAPHORE_LIMIT=3
    volumes:
      - ./graphiti/config.yaml:/app/mcp/config/config.yaml:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [cc-net]

  # ── n8n: the email facade, and nothing else ────────────────────────────────
  # Gmail credentials live only inside n8n; Central Command never sees them. The
  # DB is restored from the desktop's `n8n` database with the SAME
  # N8N_ENCRYPTION_KEY, so the OAuth refresh token survives the move and no
  # re-consent (or Google Cloud redirect-URI change) is needed.
  #
  # Single instance in the default `regular` execution mode — the desktop ran
  # queue mode (main + worker + redis) for the retired s0–s3 pipelines. The
  # facade is one synchronous webhook; a queue buys nothing here.
  n8n-db:
    image: docker.io/library/postgres:16
    container_name: cc-n8n-db
    mem_limit: 512m   # blast-radius cap (2026-07-28) — see litellm
    restart: always
    environment:
      POSTGRES_USER: ${N8N_DB_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD in deploy/pi/.env}
      POSTGRES_DB: ${N8N_DB_NAME:-n8n}
    volumes:
      - n8n_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_DB_USER:-n8n}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [cc-net]

  n8n:
    image: docker.io/n8nio/n8n:2.29.0
    container_name: cc-n8n
    mem_limit: 1g   # blast-radius cap (2026-07-28) — see litellm
    restart: always
    # Loopback only: the facade is called from this host. To reach the editor
    # UI from another tailnet device, expose it deliberately and temporarily:
    #   tailscale serve --bg --https=8443 http://127.0.0.1:5678
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME:-n8n}
      - DB_POSTGRESDB_USER=${N8N_DB_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD}
      # NEVER change after first run — it decrypts the stored Gmail credential.
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY — must match the dumped DB}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=${TIMEZONE:-UTC}
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_SECURE_COOKIE=false
      - N8N_LOG_LEVEL=info
      - N8N_RUNNERS_ENABLED=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      n8n-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [cc-net]

volumes:
  cc_pgdata:
  litellm_pgdata:
  litellm_redisdata:
  neo4j_data:
  neo4j_logs:
  n8n_pgdata:
  n8n_data:

networks:
  cc-net:
    driver: bridge
