# ============================================================================
# Graphiti MCP server configuration (Story 2.1 / D9 / AR-9)
#
#   Mounted read-only into nat-graphiti at /app/mcp/config/config.yaml
#   (CONFIG_PATH). Based on the config-docker-neo4j.yaml template embedded in
#   zepai/knowledge-graph-mcp:1.1.0-standalone (base moved from 1.0.2 on
#   2026-09-19 for `add_memory`'s `reference_time`) — the exact schema this
#   image parses; only the providers we deploy are kept. 1.1.0 added one llm
#   key, `structured_output_mode` (json_schema|json_object) — it only affects
#   the chat-completions client, which this deployment does not use (see
#   GRAPHITI_OPENAI_CLIENT in the manifest), so it is left at its default.
#
#   Secrets are ${ENV} references ONLY — values come from the container env
#   (docker-compose.yml <- .env), never from this tracked file (NFR-4).
#   Precedence: CLI > env > this yaml. `${VAR:default}` expansion supported.
#
#   LLM MIGRATED OFF ANTHROPIC 2026-08-01: claude-sonnet-5 -> the workstation's
#   Qwen3-Coder-Next via LiteLLM's `graphiti-llm` entry. Graphiti now reaches NO
#   external provider: LLM, embeddings and reranker are all local. See the long
#   note on the llm block for why the model alias must be the bridged one.
#
#   EMBEDDER MIGRATED 2026-07-26: OpenAI text-embedding-3-small (1536d) ->
#   self-hosted Qwen3-Embedding-0.6B (1024d) via the Pi's LiteLLM. The
#   provider stays "openai" because that is the WIRE PROTOCOL Graphiti speaks;
#   only the endpoint behind it changed.
#
#   Consequences, stated plainly:
#   - Embeddings now depend on the operator's WORKSTATION being up. OpenAI cannot act
#     as a fallback: 1536d vectors are meaningless against a 1024d index. The
#     only valid fallback is the SAME Qwen model on DeepInfra/OpenRouter, and
#     that parity is UNPROVEN as of this commit.
#   - Changing this model again means re-embedding the whole graph.
# ============================================================================

server:
  # HTTP streamable transport (SSE is deprecated); n8n's lib-graph connects to
  # http://graphiti:8000/mcp on nat-net (NO trailing slash on this image —
  # /mcp/ 307-redirects; see bootstrap §2.1).
  transport: "http"
  host: "0.0.0.0"
  port: 8000

llm:
  # MIGRATED OFF ANTHROPIC 2026-08-01: claude-sonnet-5 -> the workstation's
  # Qwen3-Coder-Next, through the Pi's LiteLLM. Same reasoning as the embedder
  # below — "openai" is the WIRE PROTOCOL, not the vendor.
  provider: "openai"
  # `graphiti-llm` is a PLAIN `openai/<model>` LiteLLM alias (since v2.39.0,
  # 2026-09-21), registered exactly like cc-default but scoped to its own
  # virtual key and carrying thinking-off (below). MCP 1.1.0 picks
  # graphiti_core's chat-completions client for any non-OpenAI URL; it sends
  # `response_format: json_schema`, LiteLLM forwards it, llama.cpp enforces it
  # as a grammar. Verified 2026-09-21. The former `openai/chat_completions/`
  # bridge prefix (2026-08-01 .. 2026-09-20) served the Responses-API client we
  # no longer pin; on the chat client it sends "chat_completions/<model>"
  # upstream and 404s — never reintroduce it.
  model: "graphiti-llm"
  # THINKING OFF, ON THE ALIAS (2026-09-20). A hybrid-thinking local model
  # (Qwen3.x) reasons before every one of these structured calls unless told
  # not to, and graphiti-core only sends reasoning controls for gpt-5/o1/o3
  # model names — so the switch belongs on the LiteLLM `graphiti-llm` alias, in
  # its litellm_params:  chat_template_kwargs: {"enable_thinking": false}
  # Measured 2026-09-20: 60 output tokens with a reasoning item -> 7 without. llama.cpp documents json_schema + thinking-off as
  # the working combination (ggml-org/llama.cpp#20345: the grammar is not
  # enforced while the model thinks). It is an operator-owned alias value, not
  # a tracked one: a cloud model behind this alias would reject the key.
  #
  # Enforced: the chat-completions client passes it to the request (the
  # Responses client we pinned until v2.39.0 ignored it, upstream #763). Edge
  # extraction still passes its own 16384 (upstream #1869). Thinking tokens
  # count against this cap, so it assumes the alias switch above.
  max_tokens: 4096
  # PINNED TO 0.0 (2026-08-15). It was unset for claude-sonnet-5, which rejected
  # the param, and the comment here claimed it stayed unset "because extraction
  # wants determinism". That reasoning was WRONG once the LLM moved to the
  # OpenAI client path: unset means the param is OMITTED from the request
  # (openai_client.py — `if temperature_value is not None`), so the SERVER's
  # default applies, and llama.cpp's default is temperature 1.0 / top_k 40 /
  # top_p 0.95. Measured 2026-08-15: three identical prompts returned three
  # different completions, direct to :8081 and through LiteLLM alike. Entity
  # dedup and the CONTRADICTION pass that invalidates existing facts were both
  # running on stochastic sampling. The anthropic_client.py patch cited by the
  # old comment does not touch this path at all.
  temperature: 0.0

  providers:
    openai:
      # A LiteLLM virtual key scoped to models=["graphiti-llm"] ONLY, matching
      # the embedder/reranker pattern: a leak here cannot spend on anything else.
      api_key: ${GRAPHITI_LLM_API_KEY}
      # LOAD-BEARING since MCP 1.1.0 (2026-09-19). Under 1.0.2 this was
      # decorative (the factory built CoreLLMConfig without base_url and the
      # openai SDK fell back to OPENAI_BASE_URL); 1.1.0's factory passes it as
      # the client's base_url AND sniffs it to choose the client — any URL
      # that is not api.openai.com selects the chat-completions client, which
      # the bridged alias cannot serve. GRAPHITI_OPENAI_CLIENT=responses in the
      # manifest overrides that sniff. The manifest also sets LLM_API_URL
      # explicitly so it cannot drift from this default.
      api_url: ${LLM_API_URL:http://litellm:4000/v1}

embedder:
  # "openai" = the wire protocol, not the vendor. Points at LiteLLM.
  provider: "openai"
  # model and dimensions are LITERALS on purpose, not ${ENV}. They must agree
  # with each other and with the graph's stored vectors; making them separately
  # overridable invites a silent mismatch that only shows up as bad retrieval.
  # Change them together, and re-embed the graph when you do.
  # cc-embedding is the ROLE alias (2026-08-30) — re-pointing it in LiteLLM is
  # a re-embed-the-graph migration, never a casual swap.
  model: "cc-embedding"
  dimensions: 1024

  providers:
    openai:
      # Deliberately NOT ${OPENAI_API_KEY} — this is a LiteLLM virtual key
      # (alias graphiti-embeddings) scoped to the embedding group only, so a
      # leak here cannot spend on chat models. Reusing the OpenAI var name
      # would have made the config lie about what the credential is.
      api_key: ${EMBEDDER_API_KEY}
      api_url: ${EMBEDDER_API_URL:https://api.openai.com/v1}

database:
  provider: "neo4j"

  providers:
    neo4j:
      uri: ${NEO4J_URI:bolt://neo4j:7687}
      username: ${NEO4J_USER:neo4j}
      # No default on purpose — compose fails loud if NEO4J_PASSWORD is unset
      # (the upstream template's demodemo fallback is exactly what we don't want).
      password: ${NEO4J_PASSWORD}
      database: ${NEO4J_DATABASE:neo4j}
      use_parallel_runtime: ${USE_PARALLEL_RUNTIME:false}

graphiti:
  # Single-graph MVP: everything lands in group `main` unless a caller
  # overrides per-call (lib-graph passes group_id through, default main).
  group_id: ${GRAPHITI_GROUP_ID:main}
  episode_id_prefix: ${EPISODE_ID_PREFIX:}
  user_id: ${USER_ID:operator}
  # Upstream default ontology PLUS `Person` (added 2026-08-15). The upstream list
  # has no type for a human being, so every person in the graph landed as a bare
  # `Entity` — verified against the live graph: "Jonathan Lee Rivers", "Jane
  # Anne Doe" and "the operator" all carried labels ["Entity"] and nothing
  # else, while orgs and events were typed correctly. A graph substantially about
  # the operator's family and colleagues needs the type that names them; without
  # it the extractor has nowhere to put a human and coreference has one less
  # signal to work with. Person is declared FIRST so it wins over the "use as
  # last resort" types below.
  # WHAT THE MODEL IS TOLD (since v2.39.0): MCP 1.1.0 has a built-in model for
  # every name below, and the extraction prompt's entity-types block is built
  # from those models' DOCSTRINGS — multi-line "Instructions for identifying
  # and extracting …" guidance per type. The descriptions here reach the prompt
  # ONLY for a name upstream has no model for (none today); they are kept as
  # the documented fallback, not as the guidance. GRAPHITI_ENTITY_TYPE_FIELDS=
  # none (manifest; patches/cc-entity-type-source.patch) keeps those
  # docstrings and drops the built-ins' required `description` attribute,
  # which grew without bound on a hub entity. v2.38.4 briefly made THESE
  # one-liners the guidance instead, and short episodes stopped extracting.
  entity_types:
    - name: "Person"
      description: "An individual human being — family, friends, colleagues, contacts. (Fallback text only: MCP 1.1.0's built-in Person docstring is what the prompt carries.)"
    - name: "Preference"
      description: "User preferences, choices, opinions, or selections (PRIORITIZE over most other types except User/Assistant)"
    - name: "Requirement"
      description: "Specific needs, features, or functionality that must be fulfilled"
    - name: "Procedure"
      description: "Standard operating procedures and sequential instructions"
    - name: "Location"
      description: "Physical or virtual places where activities occur"
    - name: "Event"
      description: "Time-bound activities, occurrences, or experiences"
    - name: "Organization"
      description: "Companies, institutions, groups, or formal entities"
    - name: "Document"
      description: "Information content in various forms (books, articles, reports, etc.)"
    - name: "Topic"
      description: "Subject of conversation, interest, or knowledge domain (use as last resort)"
    - name: "Object"
      description: "Physical items, tools, devices, or possessions (use as last resort)"
