# ============================================================================
# Central Command — SINGLE-NODE profile. THE deployment file.
#
#   Replaces render.sh + the five .yaml.tmpl kube-play manifests (design
#   record docs/superpowers/specs/2026-09-03-deploy-refactor-design.md, D1).
#   Runs under `podman compose` on the targets; validated in dev with
#   `docker compose config`.
#
#   ── HOW THE PIECES FIND EACH OTHER ──────────────────────────────────────
#   Compose gives every service a DNS name on the project network: the
#   SERVICE name (`neo4j`, `litellm`, `speech`). That replaces the old
#   pod-name/${CC_POD_PREFIX} convention entirely. `container_name` keeps the
#   cc- prefix so verify.sh / diagnose / update.sh address containers the way
#   they always have; a couple of legacy `cc-*` network aliases are kept so an
#   api_base an operator already typed into the LiteLLM UI still resolves.
#
#   Host reachability is loopback-published ports — 127.0.0.1, never
#   `localhost` (Windows resolves localhost to ::1 first and the podman
#   machine publishes IPv4-only). 5442 for the spine, never 5432.
#
#   ── READINESS IS IN THIS FILE, NOT IN PHASE ORDERING ────────────────────
#   healthcheck + depends_on/service_healthy express the startup order that
#   used to live in setup.sh's play sequence. Two deliberate exceptions, both
#   polled from the host by setup.sh instead:
#     * litellm ALSO gets a host-side wait — its first boot runs Prisma
#       migrations and the honest budget is five minutes;
#     * speech has NO healthcheck: its first boot downloads ~1GB of models
#       (up to 30 minutes), during which "unhealthy" is the normal state, and
#       the image's tool surface (curl/wget/python on PATH) is not ours to
#       assume. setup.sh polls /health for the real answer.
#
#   ── SECRETS ─────────────────────────────────────────────────────────────
#   Every credential comes from deploy/single/.env (0600, gitignored),
#   generated by make-secrets.sh. Nothing is rendered into a second file, so
#   there is no secrets.yaml any more. Two values must NEVER change after the
#   first run — LITELLM_SALT_KEY (encrypts the stored virtual keys) and
#   N8N_ENCRYPTION_KEY (decrypts the stored Gmail credential).
#
#   ── PROFILES ────────────────────────────────────────────────────────────
#   n8n · crawler · speech. setup.sh maps CC_ENABLE_* to COMPOSE_PROFILES.
#   The sandbox has no container here by design: sandbox containers are
#   created on demand by the runner, a HOST process (see README.md), so its
#   only deployable artifact is the image.
#
#   Image refs come from CC_IMG_* written by resolve-images.sh; the fallbacks
#   are images.txt's locked tags, so `docker compose config` works on a bare
#   checkout. The three locally-built images are EXACT — our own code is one
#   tested unit, and `localhost/` is the ref form podman resolves out of
#   local storage without asking a registry.
# ============================================================================

# Pinned so the project (and therefore the named volumes) does not depend on
# what this directory happens to be called.
name: central-command

services:
  # ── THE SPINE ─────────────────────────────────────────────────────────────
  # schema.sql is bind-mounted straight from the repo. It runs on a FRESH
  # database only (initdb); nothing applies it at runtime — update.sh does
  # that for an existing deployment.
  postgres:
    # cc-postgres-postgres, not cc-postgres: update.sh (phase 2) execs this
    # container by the kube-play name. Renamed there, not here.
    container_name: ${CC_POD_PREFIX:-cc-}postgres-postgres
    image: ${CC_IMG_POSTGRES:-docker.io/library/postgres:16}
    restart: always
    environment:
      POSTGRES_USER: central_command
      POSTGRES_PASSWORD: central_command
      POSTGRES_DB: central_command
      # Data in a SUBdirectory: the volume root is root-owned and initdb
      # refuses a non-empty/oddly-owned root.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${CC_PG_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../central_command/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U central_command -d central_command"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── THE PROXY ─────────────────────────────────────────────────────────────
  # No models in litellm-config.yaml: the catalog lives in this database
  # (store_model_in_db) and is the operator's, entered in the proxy UI during
  # setup's pause.
  litellm-db:
    container_name: ${CC_POD_PREFIX:-cc-}litellm-db
    image: ${CC_IMG_POSTGRES:-docker.io/library/postgres:16}
    restart: always
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: ${LITELLM_POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${CC_LITELLM_DB_PORT:-5443}:5432"
    volumes:
      - litellm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmproxy -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  litellm-redis:
    container_name: ${CC_POD_PREFIX:-cc-}litellm-redis
    image: ${CC_IMG_REDIS:-docker.io/library/redis:7-alpine}
    restart: always
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - litellm-redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  litellm:
    container_name: ${CC_POD_PREFIX:-cc-}litellm
    image: ${CC_IMG_BERRIAI_LITELLM_DATABASE:-ghcr.io/berriai/litellm-database:main-stable}
    restart: always
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      litellm-db:
        condition: service_healthy
      litellm-redis:
        condition: service_healthy
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      # NEVER change after first run: it encrypts every stored virtual key.
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://llmproxy:${LITELLM_POSTGRES_PASSWORD}@litellm-db:5432/litellm
      # Admin-UI login. LiteLLM reads these with os.getenv(..., None), so an
      # EMPTY string would become the real password — fall back to its own
      # defaults (admin / the master key) instead, which is what it does when
      # the vars are absent. The master key is in this environment already, so
      # this adds no exposure.
      UI_USERNAME: ${UI_USERNAME:-admin}
      UI_PASSWORD: ${UI_PASSWORD:-${LITELLM_MASTER_KEY}}
      REDIS_HOST: litellm-redis
      REDIS_PORT: "6379"
      STORE_MODEL_IN_DB: "True"
      # !! ANTHROPIC_API_KEY IS DELIBERATELY ABSENT — DO NOT ADD IT !!
      # LiteLLM injects it as a last-resort fallback in two places that
      # silently bill a pay-per-token key: the /anthropic/* passthrough
      # (injected headers BEAT the client's forwarded Authorization), and any
      # model row with neither api_key nor credential. Absent, both fail loud.
    ports:
      - "127.0.0.1:${CC_LITELLM_PORT:-4000}:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    networks:
      default:
        aliases: [cc-litellm]
    healthcheck:
      # python, not curl: the image is a python base and curl is not
      # guaranteed in it. First boot runs Prisma migrations, hence the long
      # start_period — setup.sh polls from the host as well.
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  # ── THE GRAPH ─────────────────────────────────────────────────────────────
  neo4j:
    container_name: ${CC_POD_PREFIX:-cc-}neo4j
    image: ${CC_IMG_NEO4J:-docker.io/library/neo4j:5.26.2}
    restart: always
    environment:
      # The container's expected "user/password" form; Graphiti wants the bare
      # password. Same source value, two shapes.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      # Published on LOOPBACK, unlike the k3s profile where Neo4j is
      # ClusterIP-only behind a port-forward unit. On one machine the operator
      # curation path (integrations/neo4j_writer.py) talks bolt directly.
      - "127.0.0.1:${CC_NEO4J_BOLT_PORT:-7687}:7687"
      - "127.0.0.1:${CC_NEO4J_HTTP_PORT:-7474}:7474"
    volumes:
      - neo4j-data:/data
    networks:
      default:
        aliases: [cc-neo4j]
    healthcheck:
      # A bash /dev/tcp probe on bolt — the same question verify.sh asks, and
      # it needs no tool the image is not guaranteed to ship (this image has
      # neither curl nor a guaranteed wget). Passing a password to
      # cypher-shell would put it in an argv.
      #
      # `CMD bash`, never CMD-SHELL: CMD-SHELL is `/bin/sh -c`, and on this
      # Debian base /bin/sh is dash, which has no /dev/tcp at all — the probe
      # would fail forever and every dependent service would wait for a
      # healthy that never comes.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7687"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  graphiti:
    container_name: ${CC_POD_PREFIX:-cc-}graphiti
    # LOCALLY BUILT by build-graphiti-image.sh — exact, never resolved.
    image: localhost/cc-graphiti:${CC_GRAPHITI_TAG:-1.0.2-anthropic}
    pull_policy: never
    restart: always
    depends_on:
      neo4j:
        condition: service_healthy
      litellm:
        condition: service_healthy
    environment:
      CONFIG_PATH: /app/mcp/config/config.yaml
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      GRAPHITI_LLM_API_KEY: ${GRAPHITI_LLM_API_KEY:-${LITELLM_MASTER_KEY}}
      EMBEDDER_API_KEY: ${EMBEDDER_API_KEY:-${LITELLM_MASTER_KEY}}
      EMBEDDER_API_URL: http://litellm:4000/v1
      # Decorative for the LLM (the MCP factory ignores it) but the config
      # file references it, so give it a value rather than expand empty.
      LLM_API_URL: http://litellm:4000/v1
      # The RERANKER's endpoint, and the LLM's. graphiti_core builds its
      # cross-encoder as OpenAIRerankerClient() with no config, so the openai
      # SDK falls back to these two vars — the only seam available without
      # patching the image. OPENAI_API_KEY is REQUIRED even though it is not
      # the embedder's: Graphiti.__init__ unconditionally constructs the
      # reranker client, which raises without a key.
      OPENAI_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${RERANKER_API_KEY:-${LITELLM_MASTER_KEY}}
      # GRAPHITI_RERANK_MODEL is DELIBERATELY UNSET: it selects the true
      # cross-encoder path through LiteLLM /rerank, which needs a
      # rerank-capable model this profile does not assume. Unset falls back to
      # upstream's logprob classifier against OPENAI_BASE_URL, addressing the
      # gpt-4.1-nano alias registered for exactly this. README.md "Reranking".
      GRAPHITI_TELEMETRY_ENABLED: "false"
      SEMAPHORE_LIMIT: "3"
      # The MEASURED embedding dimension (setup.sh's llm phase writes it into
      # .env). graphiti-config.yaml expands it from this container's env.
      # Never a model card's number: a mis-sized vector corrupts the Neo4j
      # index instead of erroring, and the dimension is permanent.
      CC_EMBED_DIM: ${CC_EMBED_DIM}
    ports:
      - "127.0.0.1:${CC_GRAPHITI_PORT:-8000}:8000"
    volumes:
      - ./graphiti-config.yaml:/app/mcp/config/config.yaml:ro
    healthcheck:
      # The app's interpreter lives in a venv in this image; `python3` is the
      # fallback rather than an assumption about PATH. No curl in here.
      test: ["CMD-SHELL", "p=/app/mcp/.venv/bin/python; [ -x $$p ] || p=python3; $$p -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ── OPTIONAL: n8n ─────────────────────────────────────────────────────────
  # n8n exists here for exactly one reason: it holds the Gmail OAuth
  # credential behind the email façade, so Central Command never sees it.
  # Single instance, default `regular` execution mode — the façade is one
  # synchronous webhook and a queue buys nothing.
  n8n-db:
    profiles: [n8n]
    container_name: ${CC_POD_PREFIX:-cc-}n8n-db
    image: ${CC_IMG_POSTGRES:-docker.io/library/postgres:16}
    restart: always
    environment:
      POSTGRES_USER: ${N8N_DB_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
      POSTGRES_DB: ${N8N_DB_NAME:-n8n}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - n8n-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_DB_USER:-n8n} -d ${N8N_DB_NAME:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  n8n:
    profiles: [n8n]
    container_name: ${CC_POD_PREFIX:-cc-}n8n
    image: ${CC_IMG_N8NIO_N8N:-docker.io/n8nio/n8n:2.29.0}
    restart: always
    depends_on:
      n8n-db:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      # NEVER change after first run — it decrypts the Gmail credential.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      # Browser-facing, so `localhost` is correct here (the loopback-vs-::1
      # rule is about what the SCRIPTS dial).
      WEBHOOK_URL: http://localhost:${CC_N8N_PORT:-5678}/
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_SECURE_COOKIE: "false"
      N8N_LOG_LEVEL: info
      N8N_RUNNERS_ENABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    ports:
      - "127.0.0.1:${CC_N8N_PORT:-5678}:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    healthcheck:
      # busybox wget — the image is alpine/node and ships no curl.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5678/healthz"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ── OPTIONAL: crawler ─────────────────────────────────────────────────────
  # Rung 2 of docs ingestion (Chromium under Playwright). The resource numbers
  # are the k3s ones unchanged — 3Gi is what a Playwright Chromium under load
  # actually needs, and it is the reason this is opt-OUT-able.
  #
  # The LLM credential is the LiteLLM MASTER key, which only the opt-in
  # `filter: "llm"` crawl mode uses; without it that request falls back to
  # heuristic pruning rather than failing.
  crawler:
    profiles: [crawler]
    container_name: ${CC_POD_PREFIX:-cc-}crawler
    image: localhost/cc-crawler:1
    pull_policy: never
    restart: always
    environment:
      LLM_BASE_URL: http://litellm:4000/v1
      LLM_MODEL: cc-default
      LLM_API_KEY: ${LITELLM_MASTER_KEY}
    ports:
      - "127.0.0.1:${CC_CRAWLER_PORT:-8091}:8091"
    mem_limit: 3g
    healthcheck:
      # Generous on purpose: a crawl holds the process-wide lock and Chromium
      # is slow to come up at all.
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8091/healthz')\""]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 60s

  # ── OPTIONAL: speech ──────────────────────────────────────────────────────
  # Speaches: faster-whisper STT + Kokoro TTS, behind the cc-tts / cc-stt
  # aliases the cockpit's voice features address through LiteLLM. Either alias
  # may point somewhere else instead; CC_ENABLE_SPEECH=0 means BOTH are yours.
  #
  # Models are HF-hub snapshots in a named volume (the container's HF cache).
  # PRELOAD_MODELS pulls them on first boot — from huggingface.co or the
  # CC_HF_ENDPOINT mirror; with no egress at all, pre-place the snapshots in
  # the volume (deploy/AIRGAP.md). Nothing here holds a credential: the
  # engine's API key is unset and only this host's loopback can reach it.
  #
  # No healthcheck on purpose — see the header.
  speech:
    profiles: [speech]
    container_name: ${CC_POD_PREFIX:-cc-}speech
    image: ${CC_IMG_SPEACHES_AI_SPEACHES:-ghcr.io/speaches-ai/speaches:0.8.3-cpu}
    restart: always
    environment:
      PRELOAD_MODELS: '["${CC_SPEECH_TTS_MODEL:-speaches-ai/Kokoro-82M-v1.0-ONNX}", "${CC_SPEECH_STT_MODEL:-Systran/faster-whisper-small}"]'
      HF_ENDPOINT: ${CC_HF_ENDPOINT:-https://huggingface.co}
      HF_HUB_CACHE: /home/ubuntu/.cache/huggingface/hub
    ports:
      - "127.0.0.1:${CC_SPEECH_PORT:-8093}:8000"
    volumes:
      - speech-models:/home/ubuntu/.cache/huggingface/hub
    mem_limit: 4g
    networks:
      default:
        aliases: [cc-speech]

volumes:
  pgdata:
  litellm-pgdata:
  litellm-redisdata:
  neo4j-data:
  n8n-pgdata:
  n8n-data:
  speech-models:
