# /etc/tmpfiles.d/cc-update.conf — the updater's two directories.
#   /run/cc-update      the TRIGGER channel: tmpfs, cleared on boot (a stale
#                       trigger must never fire an update at boot), writable
#                       by codyslab so cc-nerve can write the trigger file.
#   /var/lib/cc-update  the STATUS record: persistent, root-written,
#                       world-readable so cc-nerve can read status.json after
#                       its own restart. Lives OUTSIDE the repo tree because
#                       rollback's reset --hard clobbers anything inside.
# Apply: sudo systemd-tmpfiles --create /etc/tmpfiles.d/cc-update.conf
d /run/cc-update      0770 codyslab codyslab -
d /var/lib/cc-update  0755 root     root     -
