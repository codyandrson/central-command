# cc-pgweb — zero-login, READ-ONLY browser UI for inspecting the Postgres spine.
#
#   pgweb over Adminer, deliberately: PGWEB_DATABASE_URL auto-connects at
#   boot, so there is NO login form — the operator clicks the Systems link
#   and is in. The gate is reachability: loopback hostPort only, plus whatever
#   tailscale-serve entry the operator adds (https:8092 -> 127.0.0.1:8092,
#   tailnet-only). Single-operator posture — the tailnet is the perimeter.
#
#   READ-ONLY since v2.123.0 (operator ruling 2026-11-22), and enforced by
#   POSTGRES since DL-235. The tailnet decides who can REACH pgweb; it does
#   not stop a page open in the operator's own browser from sending pgweb a
#   request, and with no login pgweb cannot tell that request from a click.
#   So pgweb logs in as `cc_pgweb`, a role whose only privilege is membership
#   of `pg_read_all_data` (created by schema.sql, which a fresh database and
#   every release's schema phase both run): the server refuses every write,
#   DDL statement, grant, DO block and procedure call it is sent. pgweb's own
#   --readonly flag is NOT used — it is a keyword blacklist that let ALTER,
#   REVOKE, DO, CALL and SET through. The role's password is an in-tree
#   default like the spine's own credential in 20-postgres.yaml; it opens
#   nothing that role can change. --lock-session stops pgweb being pointed at
#   another database, --no-ssh turns off its SSH tunnel feature. Writes go
#   through psql. The args are appended to the image's entrypoint.
#
#   Stateless, but PINNED to the anchor via the same loopback-hostPort
#   pattern as cc-postgres. The LiteLLM DB has no UI on purpose (rarely
#   inspected; psql to 127.0.0.1:5443 covers it).
#
#   Multi-arch upstream image (amd64+arm64).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cc-pgweb
  namespace: central-command
spec:
  replicas: 1
  strategy:
    type: Recreate  # two pods cannot hold the same hostPort
  selector:
    matchLabels:
      app: cc-pgweb
  template:
    metadata:
      labels:
        app: cc-pgweb
    spec:
      nodeSelector:
        cc-role/anchor: "true"
      enableServiceLinks: false
      containers:
        - name: pgweb
          image: docker.io/sosedoff/pgweb:0.17.0
          args: ["--lock-session", "--no-ssh"]
          env:
            - name: PGWEB_DATABASE_URL
              value: postgres://cc_pgweb:cc_pgweb@postgres:5432/central_command?sslmode=disable
          ports:
            - name: http
              containerPort: 8081
              hostPort: 8092
              hostIP: 127.0.0.1
          readinessProbe:
            httpGet: {path: /, port: 8081}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: {memory: 32Mi, cpu: 25m}
            limits: {memory: 256Mi}
