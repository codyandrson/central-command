# ============================================================================
# LiteLLM — the proxy FLOATS (prefers the compute node), its stores stay on the anchor node.
#
#   This split is the whole point of the migration. cc-litellm is the memory hog
#   AND it is stateless: everything it must remember lives in cc-litellm-db
#   (its response cache is in its own memory and is lost on restart by
#   design, DL-225). So the hog floats to the x86_64 compute node (off the architecture where
#   the Prisma leak was measured) while its 182 MB database stays pinned to the
#   anchor node. If the compute node goes away, LiteLLM reschedules onto the anchor node and its
#   database is already there. That is real failover, and it only works because
#   the volume did NOT move.
#
#   Exposure: type: LoadBalancer, served by k3s's built-in ServiceLB (Klipper),
#   which binds :4000 on EVERY node and forwards to the pod wherever it runs.
#   So CC_LLM_BASE_URL=http://localhost:4000 keeps working on the anchor node unchanged.
#   The compose stack bound 0.0.0.0:4000, so tailnet reachability is unchanged.
# ============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cc-litellm-pgdata
  namespace: central-command
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-db
  namespace: central-command
spec:
  selector:
    app: cc-litellm-db
  ports:
    - port: 5432
      targetPort: 5432
---
# The one service the anchor host must reach at a fixed port while the pod roams.
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: central-command
spec:
  type: LoadBalancer
  selector:
    app: cc-litellm
  ports:
    - name: http
      port: 4000
      targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cc-litellm-db
  namespace: central-command
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cc-litellm-db
  template:
    metadata:
      labels:
        app: cc-litellm-db
    spec:
      # PINNED to the anchor node on purpose — see the header. This is what lets the
      # proxy fall back here without its data being stranded on a dead node.
      nodeSelector:
        cc-role/anchor: "true"
      containers:
        - name: postgres
          image: docker.io/library/postgres:16.16-trixie
          # Loopback-only hostPort, same pattern as cc-postgres:5442 — the
          # spine's autodiscovery reads LiteLLM's stored credentials from
          # here (decrypted with the salt key). Safe to hostPort a pinned
          # pod: the local-path PV means it can never move off the anchor node.
          ports:
            - containerPort: 5432
              hostPort: 5443
              hostIP: 127.0.0.1
          env:
            - name: POSTGRES_DB
              value: litellm
            - name: POSTGRES_USER
              value: llmproxy
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: cc-litellm, key: LITELLM_POSTGRES_PASSWORD}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U llmproxy -d litellm"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          resources:
            requests: {memory: 128Mi, cpu: 50m}
            limits: {memory: 1Gi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cc-litellm-pgdata
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cc-litellm
  namespace: central-command
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cc-litellm
  template:
    metadata:
      labels:
        app: cc-litellm
    spec:
      # ── THE FLOAT ────────────────────────────────────────────────────────
      # "preferred", not "required": the compute node is where this SHOULD run
      # (x86_64, 8 cores, and off the arm64 Prisma leak), but the anchor node is a
      # perfectly valid fallback and the pod must never go Pending waiting for
      # a node that is switched off.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: cc-role/compute
                    operator: In
                    values: ["true"]
      # "IgnoredDuringExecution" is literal — affinity is NOT re-evaluated for a
      # running pod. Eviction from a dead node is what actually moves it, and
      # that is driven by these tolerations. The k8s default is 300s; 30s turns
      # a compute-node outage into a ~1 minute LiteLLM gap instead of ~6.
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      containers:
        - name: litellm
          # Pinned to a version AND its digest (the multi-arch index, amd64 +
          # arm64): v1.110.2, 2026-11-21 (was 1.98.0, main-stable digest
          # 5ead13ed…). Bumping this is a deliberate act, never a pull of a
          # moving tag. NOT v1.110.0 or v1.110.1: a memory-growth bug in both
          # (the 6Gi limit below is the backstop, not the fix). 82 migrations
          # run at the first start on an existing database (measured ~2 s, plus
          # two request-log index builds, ~5 s on a 3.5 GB database); the old
          # image still starts and serves on the migrated schema, so the
          # updater's image-only rollback holds, and the clean rollback is the
          # pre-update database dump plus the old image.
          image: ghcr.io/berriai/litellm-database:v1.110.2@sha256:3b239acc68e601c436e5feeec7ca0f01a41cd5dffe50975142b7fa7155c1b2ff
          args: ["--config", "/app/config.yaml", "--port", "4000"]
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef: {name: cc-litellm, key: LITELLM_MASTER_KEY}
            # NEVER change: it encrypts every stored LiteLLM virtual key. A
            # restore under a different salt leaves the rows present but
            # undecryptable.
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef: {name: cc-litellm, key: LITELLM_SALT_KEY}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: cc-litellm, key: DATABASE_URL}
            - name: STORE_MODEL_IN_DB
              value: "True"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: {name: cc-litellm, key: OPENAI_API_KEY, optional: true}
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef: {name: cc-litellm, key: GEMINI_API_KEY, optional: true}
            # Admin-UI login, optional. Unset (key absent from the Secret) means
            # the UI falls back to username `admin` + LITELLM_MASTER_KEY.
            - name: UI_USERNAME
              valueFrom:
                secretKeyRef: {name: cc-litellm, key: UI_USERNAME, optional: true}
            - name: UI_PASSWORD
              valueFrom:
                secretKeyRef: {name: cc-litellm, key: UI_PASSWORD, optional: true}
            # !! ANTHROPIC_API_KEY IS DELIBERATELY ABSENT — DO NOT ADD IT !!
            # Carried over verbatim from deploy/pi/docker-compose.yml, where the
            # full reasoning lives. Short version: LiteLLM treats it as a
            # last-resort fallback in two places that silently bill the operator's
            # pay-per-token key instead of the Max subscription —
            #   1. /anthropic/* passthrough injects it as x-api-key, and injected
            #      headers BEAT the client's forwarded Authorization. Verified by
            #      experiment: a deliberately INVALID OAuth token still returned
            #      HTTP 200. That is the subscription being bypassed.
            #   2. A model row with neither api_key nor credential inherits it.
            # With it absent both cases fail loudly. If a model needs a key,
            # point it at the `anthropic-main` named credential instead, and
            # keep use_in_pass_through=false on every Anthropic row.
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
          # Start-up is its own probe: the first start after an image bump runs
          # the Prisma migrations before the port opens (ready at 55-68 s on a
          # loaded Pi, 63-107 s for the old image; measured 2026-11-21). The
          # kubelet holds readiness and liveness off until this passes, and
          # restarts the container only after 21 x 10 s = 210 s without an
          # answer (~3x the worst measured start), so a slow migration is not
          # read as a dead proxy by the liveness probe's own budget.
          startupProbe:
            httpGet: {path: /health/liveliness, port: 4000}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 21
          readinessProbe:
            httpGet: {path: /health/liveliness, port: 4000}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          # No initial delay: the startup probe above already waited for the
          # first answer (it used to carry the start-up wait as a flat 60 s).
          livenessProbe:
            httpGet: {path: /health/liveliness, port: 4000}
            initialDelaySeconds: 0
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              # Blast-radius cap, kept from compose. The arm64 Prisma leak is the
              # reason this exists; the cap still matters on the anchor-fallback path,
              # and costs nothing on the compute node.
              memory: 6Gi
      volumes:
        - name: config
          configMap:
            name: cc-litellm-config
