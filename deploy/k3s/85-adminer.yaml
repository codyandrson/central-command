# cc-adminer — browser UI for inspecting/fixing the Postgres spine.
#
#   Stateless, but PINNED to the anchor via the same loopback-hostPort pattern
#   as cc-postgres: the host reaches it at 127.0.0.1:8092 only, and the
#   operator's browser gets to it through a tailscale-serve TLS entry the
#   operator adds (https:8092 -> 127.0.0.1:8092). No credential lives here —
#   Adminer is a login form; the operator types the CC_DATABASE_URL user and
#   password each session, and can also reach the LiteLLM DB by changing the
#   server field.
#
#   Multi-arch upstream image (arm64+amd64). ADMINER_DEFAULT_SERVER pre-fills
#   the in-cluster service name so the login form defaults to the spine.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cc-adminer
  namespace: central-command
spec:
  replicas: 1
  strategy:
    type: Recreate  # two pods cannot hold the same hostPort
  selector:
    matchLabels:
      app: cc-adminer
  template:
    metadata:
      labels:
        app: cc-adminer
    spec:
      nodeSelector:
        cc-role/anchor: "true"
      enableServiceLinks: false
      containers:
        - name: adminer
          image: docker.io/library/adminer:5
          env:
            - name: ADMINER_DEFAULT_SERVER
              value: postgres
          ports:
            - name: http
              containerPort: 8080
              hostPort: 8092
              hostIP: 127.0.0.1
          readinessProbe:
            httpGet: {path: /, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: {memory: 32Mi, cpu: 25m}
            limits: {memory: 256Mi}
