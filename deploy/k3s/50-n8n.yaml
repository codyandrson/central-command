# ============================================================================
# n8n — the EMAIL facade, and nothing else. Pinned to the Pi, loopback only.
#
#   Gmail credentials live only inside n8n; Central Command never sees them.
#   PINNED because it is stateful (its database plus /home/node/.n8n) and
#   because there is no upside to moving it — it is a 383 MB single synchronous
#   webhook, not a resource problem.
#
#   N8N_ENCRYPTION_KEY must survive the move UNCHANGED. It decrypts the stored
#   Gmail OAuth credential; restoring the database under a different key leaves
#   the credential row present but undecryptable, which costs a re-consent and a
#   Google Cloud redirect-URI change. make-secrets.sh reads it from the existing
#   deploy/pi/.env for exactly this reason — never generate a new one.
#
#   Single instance in the default `regular` execution mode. The desktop ran
#   queue mode (main + worker + redis) for the retired s0-s3 pipelines; the
#   facade is one synchronous webhook and a queue buys nothing.
#
#   hostPort on 127.0.0.1 reproduces the compose stack's "127.0.0.1:5678:5678".
#   To reach the editor UI from another tailnet device, expose it deliberately
#   and temporarily:  tailscale serve --bg --https=8443 http://127.0.0.1:5678
# ============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cc-n8n-pgdata
  namespace: central-command
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cc-n8n-data
  namespace: central-command
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: n8n-db
  namespace: central-command
spec:
  selector:
    app: cc-n8n-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: central-command
spec:
  selector:
    app: cc-n8n
  ports:
    - port: 5678
      targetPort: 5678
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cc-n8n-db
  namespace: central-command
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cc-n8n-db
  template:
    metadata:
      labels:
        app: cc-n8n-db
    spec:
      nodeSelector:
        cc-role/anchor: "true"
      containers:
        - name: postgres
          image: docker.io/library/postgres:16
          # Deliberately NOT `envFrom: secretRef: cc-n8n` — that would inject
          # N8N_ENCRYPTION_KEY into the database container, which has no use for
          # it. Name the three keys this container actually needs.
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: cc-n8n, key: N8N_DB_USER}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: cc-n8n, key: N8N_DB_PASSWORD}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: {name: cc-n8n, key: N8N_DB_NAME}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\""]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 20
          resources:
            requests: {memory: 128Mi, cpu: 50m}
            limits: {memory: 512Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cc-n8n-pgdata
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cc-n8n
  namespace: central-command
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cc-n8n
  template:
    metadata:
      labels:
        app: cc-n8n
    spec:
      nodeSelector:
        cc-role/anchor: "true"
      containers:
        - name: n8n
          image: docker.io/n8nio/n8n:2.29.0
          ports:
            - name: http
              containerPort: 5678
              hostPort: 5678
              hostIP: 127.0.0.1
          env:
            - name: DB_TYPE
              value: postgresdb
            - name: DB_POSTGRESDB_HOST
              value: n8n-db
            - name: DB_POSTGRESDB_PORT
              value: "5432"
            - name: DB_POSTGRESDB_DATABASE
              valueFrom:
                secretKeyRef: {name: cc-n8n, key: N8N_DB_NAME}
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef: {name: cc-n8n, key: N8N_DB_USER}
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef: {name: cc-n8n, key: N8N_DB_PASSWORD}
            # NEVER change after first run — decrypts the stored Gmail credential.
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: {name: cc-n8n, key: N8N_ENCRYPTION_KEY}
            - name: N8N_HOST
              valueFrom:
                secretKeyRef: {name: cc-n8n, key: N8N_HOST}
            - name: N8N_PORT
              value: "5678"
            - name: N8N_PROTOCOL
              value: http
            - name: WEBHOOK_URL
              valueFrom:
                secretKeyRef: {name: cc-n8n, key: N8N_WEBHOOK_URL}
            - name: GENERIC_TIMEZONE
              valueFrom:
                secretKeyRef: {name: cc-n8n, key: TIMEZONE, optional: true}
            - name: N8N_DEFAULT_BINARY_DATA_MODE
              value: filesystem
            - name: N8N_SECURE_COOKIE
              value: "false"
            - name: N8N_LOG_LEVEL
              value: info
            - name: N8N_RUNNERS_ENABLED
              value: "true"
            - name: N8N_BLOCK_ENV_ACCESS_IN_NODE
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
          readinessProbe:
            httpGet: {path: /healthz, port: 5678}
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          resources:
            requests: {memory: 256Mi, cpu: 100m}
            limits: {memory: 1Gi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cc-n8n-data
