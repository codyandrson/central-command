# ============================================================================
# The k3s profile's ROLE-ALIAS declaration for register-models.py.
#
#   Read by:   python3 deploy/shared/litellm/register-models.py  (setup.sh llm)
#   Guarded by: tests/test_single_models_declaration.py,
#               tests/test_register_models_upstream.py
#
# The single-node profile's twin is deploy/single/models.json. Both list only
# the cc-* ROLE aliases Central Command addresses. register-models.py is
# CREATE-ONLY: an absent alias is created as a skeleton (PLACEHOLDER where the
# provider goes, never a key), an existing row is never written to, and the
# re-run checks a filled row against the patterns below. Every alias here is
# required except those marked `optional: true`.
#
# Per-model timeouts, costs and capability flags live on the model's row in
# the proxy's database (DL-226), set through the litellm-manager agent's gated
# proposals or the LiteLLM UI — the same at every site. This file declares
# nothing about a specific model.
#
# Field meanings: `registration:` is what an absent alias is created with
# (model / api_base patterns, mode, timeout — a value without PLACEHOLDER is
# an exact invariant); `extra_params:` are litellm_params the alias does not
# work without, written at create and checked afterwards; `policy_params:` are
# written into a created skeleton only and never checked; `judged_by_probe`
# means a filled row is judged by setup's probe, not by the patterns.
#
# Why the chat aliases carry a long timeout: on a site where one local model
# server queues every request, a slow run should wait its turn, not fail. A
# dead server still refuses the connection at once; the timeout only governs
# a request that is connected and queued.
# ============================================================================
registration_only:
  # What every agent addresses.
  cc-default:
    registration:
      model: openai/PLACEHOLDER
      api_base: PLACEHOLDER
      timeout: 6000

  # Graph extraction (graphiti-core in the app process). A PLAIN openai/ alias:
  # the old openai/chat_completions/ bridge prefix 404s and the re-run refuses
  # it. graphiti-core sends no reasoning control of its own, so thinking is
  # switched off ON THE ROW; a cloud model that rejects chat_template_kwargs
  # needs this block deleted and thinking turned off its provider's way.
  graphiti-llm:
    registration:
      model: openai/PLACEHOLDER
      api_base: PLACEHOLDER
      timeout: 6000   # one queue may answer both chat aliases (DL-204)
    extra_params:
      chat_template_kwargs:
        enable_thinking: false

  # The embedder. Re-pointing it is a MIGRATION (re-embed the graph:
  # skills/graphiti/references/operations.md), never a swap.
  cc-embedding:
    registration:
      model: openai/PLACEHOLDER
      api_base: PLACEHOLDER
      timeout: 60

  # Graph search's reranker, OPTIONAL. The skeleton is the dedicated shape
  # (LiteLLM's cohere client POSTs api_base verbatim, so it MUST end in
  # /v1/rerank); a chat model used as a reranker is right too, and setup's
  # probe decides.
  cc-rerank:
    registration:
      model: cohere/PLACEHOLDER
      api_base: PLACEHOLDER/v1/rerank
      mode: rerank
      timeout: 60
    judged_by_probe: true
    optional: true

  # The cockpit's read-aloud and voice input. The bundled engine is
  # api_base http://cc-speech:8093/v1 (the SERVICE port, 90-speech.yaml), key
  # `none`. One job at a time and no proxy retries, per alias (DL-220) — never
  # a global LiteLLM setting.
  cc-tts:
    registration:
      model: openai/PLACEHOLDER
      api_base: PLACEHOLDER
      mode: audio_speech
      timeout: 120
    policy_params:
      max_parallel_requests: 1
      num_retries: 0
  cc-stt:
    registration:
      model: openai/PLACEHOLDER
      api_base: PLACEHOLDER
      mode: audio_transcription
      timeout: 180
    policy_params:
      max_parallel_requests: 1
      num_retries: 0
